<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2c3e50"><title>HTML to PDF</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HTML to PDF"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1b2535;background:#f6f7fb;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:520px;margin:48px auto 30px}h1{font-size:29px;letter-spacing:-.7px;margin:0 0 7px}p{color:#697386;line-height:1.55}.panel{background:#fff;border:1px solid #e5e9f1;border-radius:24px;padding:24px;box-shadow:0 10px 35px #192c4b0c;margin-top:25px}.mark{display:inline-grid;place-items:center;width:48px;height:48px;background:#e7f0ff;color:#0868db;border-radius:15px;font-size:25px;margin-bottom:16px}.picker{display:block;border:2px dashed #b8c9e4;border-radius:18px;padding:27px 14px;text-align:center;cursor:pointer;background:#f9fbff;color:#155cbb;font-weight:700}.picker small{display:block;color:#76839a;font-weight:400;margin-top:7px}input[type=file]{position:absolute;opacity:0;width:1px;height:1px}.file{margin:15px 0;font-size:14px;overflow-wrap:anywhere;color:#40516a}.btn{width:100%;border:0;border-radius:999px;padding:15px;background:#0877f9;color:white;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:13px;min-height:22px;margin-top:13px;color:#516278}.hint{font-size:12px;text-align:center;margin-top:24px}#capture{position:fixed;left:-100000px;top:0;z-index:-10;background:#fff;color:#333;max-width:none;width:max-content;overflow:visible;font-family:Poppins,Arial,sans-serif}#capture *{color-scheme:light}#capture h1{text-align:center;color:#0056b3;font-size:30px;font-weight:800;letter-spacing:1px;margin:8px 0 4px;white-space:nowrap}#capture .rule{height:2px;background:#0056b3;width:90%;margin:0 auto 16px}#capture table{border-collapse:collapse!important;border-spacing:0!important;width:max-content!important;max-width:none!important;table-layout:auto!important;background:#fff!important}#capture th,#capture td{white-space:nowrap!important;overflow-wrap:normal!important;word-break:normal!important;padding:6px 8px!important;font-size:12px!important;line-height:1.3!important;vertical-align:middle!important;box-sizing:border-box!important;border:1px solid #e2e5ea!important;box-shadow:none!important}#capture th{background:#0056b3!important;color:#fff!important;font-weight:600!important;position:static!important}#capture td{color:#333!important;background:transparent!important}#capture tr:nth-child(odd){background:#fff!important}#capture tr:nth-child(even){background:#f5f5f5!important}#capture tr,#capture td{border-left-color:#e2e5ea!important}#capture .medal{display:inline-block;border-radius:50%;width:25px;height:25px;line-height:22px;text-align:center;font-weight:700;box-shadow:0 2px 4px #0003;border:2px solid white}#capture .gold{background:#ffd700!important;color:#333!important;border-color:#b8860b!important}#capture .silver{background:#c0c0c0!important;color:#fff!important;border-color:#a9a9a9!important}#capture .bronze{background:#cd7f32!important;color:#fff!important;border-color:#8b4513!important}
#installApp{display:none;margin-top:12px;background:#2c3e50}#installHelp{display:none;font-size:13px;margin-top:12px;line-height:1.5;color:#516278}</style></head><body><main><div class="mark">↗</div><h1>HTML a PDF</h1><p>Convierte archivos HTML a PDF de forma sencilla, directamente en tu dispositivo.</p><section class="panel"><label class="picker" for="input">Seleccionar archivo HTML<small>Selecciona un documento .html o .htm</small></label><input id="input" type="file" accept=".html,.htm,text/html"><div id="file" class="file">Ningún archivo seleccionado</div><button class="btn" id="convert" disabled>Convertir a PDF</button><div id="status" class="status" role="status" aria-live="polite"></div><button class="btn" id="installApp" type="button">Instalar aplicación</button><div id="installHelp" role="status"></div></section><p class="hint">Conversión local en tu dispositivo. Requiere internet para cargar las bibliotecas PDF. El archivo HTML no se envía a ningún servidor.</p></main><div id="capture" aria-hidden="true"></div><script>
const input=document.getElementById('input'),button=document.getElementById('convert'),status=document.getElementById('status'),fileLabel=document.getElementById('file'),capture=document.getElementById('capture');let selected=null;
input.addEventListener('change',()=>{selected=input.files[0]||null;button.disabled=!selected;fileLabel.textContent=selected?selected.name:'Ningún archivo seleccionado';status.textContent='';});
function loadScript(src,check){if(check())return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar una biblioteca. Comprueba tu conexión.'));document.head.append(s);});}
async function libs(){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>!!window.html2canvas);await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>!!window.jspdf?.jsPDF);}
function getTable(doc){const choices=['#resultados-table','#summaryTable table','#resultadosTabla','table'];return choices.map(s=>doc.querySelector(s)).find(t=>t?.tagName==='TABLE'&&t.querySelector('tr'));}
function cleanName(n){return n.replace(/\.(html?|HTML?)$/,'').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim()||'Documento';}
button.addEventListener('click',async()=>{if(!selected)return;button.disabled=true;button.textContent='Generando PDF…';capture.replaceChildren();try{status.textContent='Leyendo HTML…';const html=await selected.text();const parsed=new DOMParser().parseFromString(html,'text/html');const table=getTable(parsed);if(!table)throw new Error('No encontré una tabla en el archivo HTML seleccionado.');const title=parsed.querySelector('.summary-title-download,#main-title,h1')?.textContent?.trim()||cleanName(selected.name);const heading=document.createElement('h1');heading.textContent=title;const rule=document.createElement('div');rule.className='rule';const copy=document.importNode(table,true);copy.querySelectorAll('script,iframe,button,input,select,textarea').forEach(n=>n.remove());copy.querySelectorAll('*').forEach(el=>{el.removeAttribute('onclick');el.removeAttribute('onerror');el.removeAttribute('onload');el.classList.remove('row-duplicate');el.style.removeProperty('border-left');el.style.removeProperty('box-shadow');});capture.style.padding='10px 12px';capture.append(heading,rule,copy);status.textContent='Preparando tabla…';await libs();await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const width=capture.scrollWidth,height=capture.scrollHeight;if(width<100||height<40)throw new Error('La tabla está vacía.');const scale=Math.min(2,Math.max(1,1800/width),Math.sqrt(15000000/(width*height)));status.textContent='Creando PDF…';const canvas=await html2canvas(capture,{backgroundColor:'#fff',scale:Math.max(.65,scale),useCORS:true,logging:false,windowWidth:Math.max(1200,width)});const mm=.264583;const pw=width*mm,ph=height*mm;if(pw>5000||ph>5000)throw new Error('La tabla es demasiado grande para un único PDF.');const pdf=new jspdf.jsPDF({orientation:pw>ph?'landscape':'portrait',unit:'mm',format:[pw,ph],compress:true});pdf.addImage(canvas.toDataURL('image/jpeg',.94),'JPEG',0,0,pw,ph,undefined,'FAST');const name=cleanName(selected.name)+'.pdf';const blob=pdf.output('blob'),out=new File([blob],name,{type:'application/pdf'});status.textContent='PDF listo.';if(navigator.share&&navigator.canShare?.({files:[out]})){try{await navigator.share({files:[out],title:name});}catch(e){if(e.name!=='AbortError')throw e;}}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}}catch(e){console.error(e);status.textContent='Error: '+e.message;}finally{capture.replaceChildren();button.disabled=false;button.textContent='Convertir a PDF';}});
</script><script>
let deferredInstallPrompt=null;
const installButton=document.getElementById('installApp');
const installHelp=document.getElementById('installHelp');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.style.display='block';installHelp.style.display='none';});
installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;const prompt=deferredInstallPrompt;deferredInstallPrompt=null;installButton.style.display='none';await prompt.prompt();try{await prompt.userChoice;}catch(_){} });
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.style.display='none';installHelp.style.display='none';});
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(!standalone){const ua=navigator.userAgent;const isIOS=/iPad|iPhone|iPod/.test(ua);if(isIOS){installHelp.textContent='Para instalar en iPhone: abre esta página en Safari, toca Compartir y elige Añadir a pantalla de inicio.';installHelp.style.display='block';}}
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:',err)));}</script></body></html>
